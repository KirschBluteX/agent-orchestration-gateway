name: Bug report
description: Report a reproducible AOG installation, routing, lifecycle, or verification problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: checkboxes
    attributes:
      label: Safety
      options:
        - label: I removed credentials, private task content, customer code, and unredacted logs.
          required: true
  - type: input
    attributes:
      label: AOG version
      placeholder: 0.10.0
    validations:
      required: true
  - type: input
    attributes:
      label: Codex, Python, and operating system
      placeholder: Codex version; Python version; Windows or Linux
    validations:
      required: true
  - type: textarea
    attributes:
      label: Doctor output
      description: Redact paths or identifiers that should not be public.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction and expected behavior
    validations:
      required: true
