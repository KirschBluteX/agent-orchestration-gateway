name: Feature request
description: Propose a focused improvement that preserves CCO's control-plane boundaries.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: User problem
      description: Describe the concrete workflow, cost, time, quality, or safety problem.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior and acceptance evidence
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Scope
      options:
        - label: This proposal does not require submitting secrets or private task content.
          required: true
