name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check out pinned OpenAI skill validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: openai/skills
          ref: 49f948faa9258a0c61caceaf225e179651397431
          path: .codex-skill-validator

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 ruff==0.15.22

      - name: Run Ruff
        run: python -m ruff check plugins tests .github/scripts

      - name: Run unit tests
        run: python -X utf8 -B -m unittest discover -s tests -v

      - name: Run repository plugin contract validator
        run: python .github/scripts/validate_plugin.py plugins/codex-cost-orchestrator

      - name: Run skill validator
        run: |
          python .codex-skill-validator/skills/.system/skill-creator/scripts/quick_validate.py plugins/codex-cost-orchestrator/skills/orchestrate
          python .codex-skill-validator/skills/.system/skill-creator/scripts/quick_validate.py plugins/codex-cost-orchestrator/skills/manage-cco

      - name: Check patch whitespace
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
