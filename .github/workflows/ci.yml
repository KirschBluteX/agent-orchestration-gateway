name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out pinned OpenAI Skill validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: openai/skills
          ref: 49f948faa9258a0c61caceaf225e179651397431
          path: .codex-skill-validator

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install validation tools
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 ruff==0.15.22

      - name: Run static checks
        run: |
          python -m ruff check plugins tests
          python -m ruff format --check plugins tests
          python -m compileall -q plugins/agent-orchestration-gateway/skills/orchestrate/scripts tests

      - name: Run unit tests
        run: python -X utf8 -B -m unittest discover -s tests -v

      - name: Validate Skill
        run: python .codex-skill-validator/skills/.system/skill-creator/scripts/quick_validate.py plugins/agent-orchestration-gateway/skills/orchestrate
