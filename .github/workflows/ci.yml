name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check out pinned OpenAI skill validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: openai/skills
          ref: 49f948faa9258a0c61caceaf225e179651397431
          path: .codex-skill-validator

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Run unit tests
        run: python -X utf8 -B -m unittest discover -s tests -v

      - name: Run repository plugin contract validator
        run: python .github/scripts/validate_plugin.py plugins/codex-cost-orchestrator

      - name: Run skill validator
        run: >-
          python
          .codex-skill-validator/skills/.system/skill-creator/scripts/quick_validate.py
          plugins/codex-cost-orchestrator/skills/orchestrate

      - name: Check POSIX compatibility wrappers
        if: runner.os == 'Linux'
        run: |
          sh -n plugins/codex-cost-orchestrator/scripts/install-agents.sh
          sh -n plugins/codex-cost-orchestrator/scripts/inspect-agent-runtime.sh
          sh -n plugins/codex-cost-orchestrator/scripts/verify.sh

      - name: Check patch whitespace
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
